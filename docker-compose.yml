version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: collabsuite-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: collabsuite
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: collabsuite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local